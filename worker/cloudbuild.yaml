# Build the Cadence worker image (Python + FFmpeg + ML, ~multi-GB with baked models).
# Source/context = repo ROOT; Dockerfile at worker/Dockerfile. A high-CPU machine and a
# long timeout keep the heavy pip install + model prefetch comfortably inside the budget.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'worker/Dockerfile'
      - '-t'
      - '${_IMAGE}'
      - '.'
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
